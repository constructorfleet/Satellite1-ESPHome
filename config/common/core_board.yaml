psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

i2c:
  - id: i2c_0
    sda: GPIO5
    scl: GPIO6
    frequency: 400kHz
    scan: true

spi:
  - id: spi_0
    clk_pin: GPIO12
    mosi_pin: GPIO11
    miso_pin: GPIO13
    interface: SPI2

uart:
  - id: uart_mmwave
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 256000
    parity: NONE
    stop_bits: 1

i2s_audio:
  - id: i2s_shared
    i2s_lrclk_pin: GPIO07
    i2s_bclk_pin: GPIO08
    i2s_mclk_pin: GPIO16
    access_mode: duplex
    i2s_mode: secondary
